<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`, e.g. /remap-tour/ on GitHub Pages. -->
  <base href="/remap-tour/">

  <meta charset="UTF-8">
  <!-- Phone width from the first paint, so the loading screen's logo has
       the same size as Android's launch screen (Flutter keeps it after). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Remap tour riders, prices, payments and expenses. Works without signal.">
  <meta name="theme-color" content="#D65320">

  <!-- Installed as an app: Chrome "Install app", Safari "Add to Home Screen". -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Remap Tour">
  <link rel="apple-touch-icon" href="icons/p44-apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon-p44.png">
  <link rel="manifest" href="manifest.json">

  <title>Remap Tour</title>
  <style>
    /* The loading screen continues Android's launch screen exactly: the
       logo's own carbon colour (manifest background_color) full screen and
       the same logo at the same size, its edges fading into that colour. */
    html, body { margin: 0; height: 100%; background: #151413; }
    #splash {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #151413; transition: opacity .25s;
    }
    #splash img { width: 176px; height: 176px; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/p44-512.png" alt="P44 Remap Tour">
  </div>
  <script>
    // Hide the loading screen once Flutter has drawn the app.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.style.opacity = '0'; setTimeout(function () { splash.remove(); }, 300); }
    });
    // Offline support and automatic updates (see sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
