<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`, e.g. /remap-tour/ on GitHub Pages. -->
  <base href="/remap-tour/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Remap tour riders, prices, payments and expenses. Works without signal.">
  <meta name="theme-color" content="#D65320">

  <!-- Installed as an app: Chrome "Install app", Safari "Add to Home Screen". -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Remap Tour">
  <link rel="apple-touch-icon" href="icons/p44-apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon-p44.png">
  <link rel="manifest" href="manifest.json">

  <title>Remap Tour</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f6f4f1; }
    @media (prefers-color-scheme: dark) { html, body { background: #15171b; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #8a7f76; letter-spacing: .08em; transition: opacity .25s;
    }
    #splash img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/p44-192.png" alt="">
    <div>REMAP TOUR</div>
  </div>
  <script>
    // Hide the loading screen once Flutter has drawn the app.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.style.opacity = '0'; setTimeout(function () { splash.remove(); }, 300); }
    });
    // Offline support and automatic updates (see sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
